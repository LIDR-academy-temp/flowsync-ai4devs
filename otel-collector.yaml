# OpenTelemetry Collector local de FlowSync (servicio `observability` de
# compose.yaml). Recibe trazas por OTLP y las escribe en su propio log.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
