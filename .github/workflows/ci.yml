name: CI

# Cada trabajo responde a una pregunta:
#   test            ¿la suite del backend pasa en una máquina limpia?
#   image           ¿el artefacto se puede fabricar desde cero?
#   lint-workflows  ¿los ficheros del pipeline son válidos?
#   infra-plan      ¿qué cambiaría en la infraestructura si se fusiona este PR?
#   infra-apply     aplica ese plan cuando el PR se fusiona.
#
# Sin `paths` aquí a propósito: el filtro por `.railway/**` apagaría también
# test, image y lint-workflows. Lo resuelve el primer paso de cada trabajo de
# infra.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Nada por defecto: cada trabajo declara lo mínimo que necesita.
permissions: {}

# Un push nuevo a la misma referencia cancela la ejecución anterior. El cierre
# del PR va a un grupo propio y sin cancelación: ahí corre infra-apply, y un
# apply a medias no se cancela nunca.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'closed' && '-cierre' || '' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  test:
    name: Tests del backend
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      # Hace el papel de `db-test` de compose.yaml: misma imagen, mismo puerto y
      # mismas credenciales que espera backend/.env.test.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flowsync
          POSTGRES_PASSWORD: flowsync
          POSTGRES_DB: flowsync_test
        ports:
          - 54411:5432
        options: >-
          --health-cmd "pg_isready -U flowsync -d flowsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # La base ya la da el servicio: `make db-up` no arranca Docker, que
      # chocaría con el 54411.
      DB_EXTERNA: 1
      # `start/env.ts` valida estas variables al arrancar y .env.test no las
      # trae (las DB_* y SESSION_DRIVER sí). Mismo criterio que openapi.yml:
      # ninguna es un secreto. NODE_ENV=test hace que Adonis cargue .env.test,
      # también en el primer `migration:run` de `make migrate`.
      NODE_ENV: test
      PORT: 3333
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      APP_KEY: clave-de-ci-sin-valor-secreto
      APP_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      # El mismo comando que en local. pipefail: sin él, el código de salida
      # sería el de `tee` y unos tests en rojo darían el paso por bueno.
      - name: make test
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/make-test.log"

      # Japa cierra con una línea `Tests  8 passed, 61 failed (69)`. Se quitan
      # los códigos de color antes de leerla. Corre también si los tests fallan.
      - name: Resumen de los tests
        if: ${{ !cancelled() }}
        run: |
          log="$RUNNER_TEMP/make-test.log"
          linea=""
          if [ -f "$log" ]; then
            linea=$(sed -E 's/\x1b\[[0-9;]*m//g' "$log" | grep -E '^ *Tests ' | tail -n 1 || true)
          fi
          {
            echo "## Tests del backend"
            echo
            if [ -z "$linea" ]; then
              echo "No hay recuento: \`make test\` no llegó a ejecutar la suite. Mira el log del paso."
            else
              pasados=$(grep -oE '[0-9]+ passed' <<<"$linea" | grep -oE '[0-9]+' || echo 0)
              fallidos=$(grep -oE '[0-9]+ failed' <<<"$linea" | grep -oE '[0-9]+' || echo 0)
              total=$(grep -oE '\([0-9]+\)' <<<"$linea" | tr -d '()')
              echo "| Pasados | Fallidos | Total |"
              echo "|---:|---:|---:|"
              echo "| $pasados | $fallidos | $total |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Imagen de la API
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # LÍMITE: este trabajo afirma que la imagen se construye, no que arranque.
      # No se lanza el contenedor: sin base de datos ni configuración, que
      # arranque no se comprueba aquí.
      - name: make image
        run: make image

  lint-workflows:
    name: actionlint
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make ci-lint
        run: make ci-lint

  infra-plan:
    name: Plan de Railway
    # Solo PR abiertos y del propio repositorio: un fork no recibe RAILWAY_TOKEN.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # La acción publica el plan como comentario del PR; también da lectura
      # para listar los ficheros del PR en el primer paso.
      pull-requests: write
    steps:
      # El filtro por `.railway/**`: se piden a la API los ficheros del PR y el
      # resto de pasos solo corre si alguno cae ahí. Se guarda la lista antes
      # de buscar en ella: con `| grep -q` y pipefail, el SIGPIPE de gh daría un
      # falso «no toca .railway/».
      - name: ¿El PR toca .railway/?
        id: cambios
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ficheros=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -q '^\.railway/' <<<"$ficheros"; then
            echo "railway=true" >> "$GITHUB_OUTPUT"
          else
            echo "railway=false" >> "$GITHUB_OUTPUT"
            echo "El PR no toca .railway/: no hay plan que hacer."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cambios.outputs.railway == 'true'
        with:
          persist-credentials: false

      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        if: steps.cambios.outputs.railway == 'true'
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  infra-apply:
    name: Apply de Railway
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Listar los ficheros del PR. El apply no comenta, así que no hay write.
      pull-requests: read
      # La acción busca y descarga el artefacto del plan con la API de Actions.
      actions: read
    # Dos PR fusionados seguidos no aplican a la vez sobre el mismo entorno, y
    # el que está en curso nunca se cancela.
    concurrency:
      group: railway-apply
      cancel-in-progress: false
    steps:
      - name: ¿El PR toca .railway/?
        id: cambios
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ficheros=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -q '^\.railway/' <<<"$ficheros"; then
            echo "railway=true" >> "$GITHUB_OUTPUT"
          else
            echo "railway=false" >> "$GITHUB_OUTPUT"
            echo "El PR no toca .railway/: no hay nada que aplicar."
          fi

      # El commit que entró en la rama base, no la referencia refs/pull/N/merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cambios.outputs.railway == 'true'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        if: steps.cambios.outputs.railway == 'true'
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
