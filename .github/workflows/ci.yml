# Pipeline de FlowSync: cinco trabajos, cada uno responde a una sola pregunta.
#
# - test, image y lint-workflows corren en paralelo en cada PR y en cada push a main.
# - infra-plan e infra-apply solo hacen algo en PR del propio repositorio que
#   toquen `.railway/**` (ver «Filtro por ruta» más abajo).
#
# Secretos: solo RAILWAY_TOKEN, dado de alta en Settings → Secrets and variables
# → Actions. Ningún valor secreto vive en este fichero.
name: ci

on:
  pull_request:
    # `closed` hace falta para infra-apply (PR fusionado). Los demás trabajos lo
    # ignoran con su `if`.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# Nada a nivel de workflow: cada trabajo pide lo suyo y nada más.
permissions: {}

# Un push nuevo a la misma rama (o al mismo PR) cancela la ejecución anterior:
# solo interesa el último commit.
#
# Por qué no puede interrumpir un infra-apply a medias: infra-apply solo corre en
# el evento `closed` de un PR fusionado, y esas ejecuciones van a un grupo propio
# con el `run_id`, que es único por ejecución. Ningún otro evento cae nunca en ese
# grupo, así que `cancel-in-progress` no tiene a quién cancelar. Además, el propio
# trabajo lleva un `concurrency` sin cancelación (ver infra-apply) para que dos
# fusiones seguidas apliquen una detrás de otra y no a la vez.
#
# Se agrupa por número de PR y no por nombre de rama (`head_ref`): dos forks con
# una rama `patch-1` cada uno se cancelarían entre sí.
concurrency:
  group: ci-${{ github.event.action == 'closed' && format('cierre-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `shell: bash` explícito hace que cada `run` vaya con `-eo pipefail`. Sin él,
# GitHub usa `bash -e` y un `make test | tee` daría verde aunque fallara make.
defaults:
  run:
    shell: bash

jobs:
  # ¿La suite del backend pasa en una máquina limpia?
  test:
    name: suite del backend
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      # La misma imagen que `db-test` de compose.yaml, en el puerto que espera
      # backend/.env.test (usuario flowsync, contraseña flowsync, base flowsync_test).
      # El healthcheck pregunta por TCP, como en compose.yaml, para no dar por sana
      # la base mientras la imagen la está creando.
      db-test:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flowsync
          POSTGRES_PASSWORD: flowsync
          POSTGRES_DB: flowsync_test
        ports:
          - 54411:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flowsync -d flowsync_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    env:
      # `start/env.ts` valida estas variables al arrancar y backend/.env.test no las
      # trae (solo SESSION_DRIVER y DB_*). Como en openapi.yml, ninguna es un
      # secreto: APP_KEY existe solo para que la validación pase.
      # NODE_ENV=test hace que Adonis cargue .env.test también en el primer
      # `migration:run` de `make migrate` (el «de desarrollo»): en CI no hay
      # backend/.env y las dos pasadas migran flowsync_test (la segunda no hace nada).
      # No se ponen aquí SESSION_DRIVER ni DB_*: el entorno del proceso pisa a
      # .env.test y se saldría de lo que usa la suite en local.
      NODE_ENV: test
      PORT: 3333
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      APP_KEY: clave-de-ci-sin-valor-secreto
      APP_URL: http://127.0.0.1:3333
      # La base la pone el servicio de arriba: `make db-up` no levanta Compose
      # (chocaría con el 54411). Ver el objetivo db-up del Makefile.
      DB_EXTERNA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `make test` no instala dependencias (en local lo hace `make setup`).
      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      # Exactamente `make test`; el `tee` solo guarda la salida para el recuento.
      - name: make test
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/make-test.log"

      # El recuento va al resumen de la ejecución, que es lo que se ve sin abrir
      # el registro. Sale de la línea «Tests  N passed, M failed (T)» del
      # reporter de Japa; corre también si la suite falla.
      - name: Recuento de tests en el resumen
        if: always()
        run: |
          log="$RUNNER_TEMP/make-test.log"
          linea=""
          if [ -f "$log" ]; then
            linea=$(sed -E 's/\x1b\[[0-9;]*m//g' "$log" | grep -E '^[[:space:]]*Tests[[:space:]]' | tail -n 1 || true)
          fi
          {
            echo "## Suite del backend"
            echo
            if [ -z "$linea" ]; then
              echo "No hay recuento: la suite no llegó a ejecutarse. Mira el paso «make test»."
            else
              pasados=$(grep -oE '[0-9]+ passed' <<<"$linea" | grep -oE '[0-9]+' || echo 0)
              fallidos=$(grep -oE '[0-9]+ failed' <<<"$linea" | grep -oE '[0-9]+' || echo 0)
              total=$(grep -oE '\([0-9]+\)' <<<"$linea" | grep -oE '[0-9]+' || echo '?')
              echo "| Pasados | Fallidos | Total |"
              echo "|---:|---:|---:|"
              echo "| $pasados | $fallidos | $total |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ¿El artefacto se puede fabricar desde cero?
  #
  # Este trabajo afirma que la imagen SE CONSTRUYE, no que arranque ni que
  # responda: no hay `docker run`, ni variables, ni base de datos.
  image:
    name: imagen de la API
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make image
        run: make image

  # ¿Los archivos del pipeline son válidos?
  lint-workflows:
    name: workflows válidos
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make ci-lint
        run: make ci-lint

  # ¿Qué cambiaría en la infraestructura si se fusiona?
  #
  # Filtro por ruta: un paso que pide a la API la lista de ficheros del PR
  # (`gh api .../pulls/N/files`) y decide si sigue. Se eligió así porque:
  # - `on.pull_request.paths` filtra el workflow ENTERO: test, image y
  #   lint-workflows dejarían de correr en los PR que no tocan `.railway/`.
  # - un trabajo previo de detección sería el sexto trabajo.
  # - una acción de filtros (dorny/paths-filter y similares) es otro tercero con
  #   acceso al token del trabajo, y otro SHA que mantener.
  # - mira el PR entero y no solo el último push: si el PR tocó `.railway/`, cada
  #   push vuelve a planificar, que es lo que necesita infra-apply para encontrar
  #   el plan del último commit.
  # El precio: cuando el PR no toca `.railway/`, el trabajo sale en verde sin haber
  # planificado nada (los pasos se saltan, el trabajo no).
  infra-plan:
    name: plan de infraestructura
    # Solo PR abiertos o actualizados que vienen del propio repositorio: un PR de
    # un fork no ve RAILWAY_TOKEN y no debe poder planificar contra el entorno.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout de .railway/
      pull-requests: write # leer los ficheros del PR y publicar el plan como comentario
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ¿El PR toca .railway/?
        id: rutas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          archivos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -q '^\.railway/' <<<"$archivos"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "El PR no toca .railway/: no hay plan que hacer." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Planifica, sube el plan como artefacto y lo comenta en el PR con el token
      # del trabajo (por eso `pull-requests: write`). Sin `id-token: write`, la
      # acción no intenta comentar con la identidad de Railway y usa ese token.
      - name: railway config plan
        if: steps.rutas.outputs.infra == 'true'
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  # ¿Se aplica en la infraestructura lo que se revisó en el plan del PR?
  infra-apply:
    name: aplicar infraestructura
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Una sola aplicación a la vez en todo el repositorio, y la que está en marcha
    # nunca se cancela. Ojo: GitHub deja solo UNA en espera; si se fusionan tres PR
    # seguidos mientras la primera aplica, la segunda (aún sin empezar) se
    # descarta y espera la tercera.
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    permissions:
      contents: read # checkout del commit fusionado
      pull-requests: read # leer los ficheros del PR
      actions: read # la acción descarga el artefacto del plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: ¿El PR toca .railway/?
        id: rutas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          archivos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -q '^\.railway/' <<<"$archivos"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "El PR no toca .railway/: no hay nada que aplicar." >> "$GITHUB_STEP_SUMMARY"
          fi

      # No vuelve a planificar: aplica el plan que se subió como artefacto en el
      # último infra-plan del PR, y falla si el entorno o .railway/ han cambiado.
      - name: railway config apply
        if: steps.rutas.outputs.infra == 'true'
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
