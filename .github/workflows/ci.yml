# Pipeline de FlowSync: cinco trabajos, y cada uno responde a UNA pregunta. Un
# trabajo en verde afirma su pregunta y nada más; lo que no afirma va escrito en
# su comentario, para que «todo verde» no se lea como «todo bien».
#
#   test            ¿la suite del backend pasa en una máquina limpia?
#   image           ¿el artefacto se puede fabricar desde cero?
#   lint-workflows  ¿los propios archivos del pipeline son válidos?
#   infra-plan      ¿qué cambiaría en la infraestructura si este cambio se fusiona?
#   infra-apply     el mismo plan, aplicado, cuando el pull request se fusiona.
#
# Los tres primeros corren en paralelo y no necesitan ninguna llave. Los dos de
# infraestructura sí (RAILWAY_TOKEN) y por eso solo corren para lo de dentro: un
# pull request desde un fork no recibe los secretos del repositorio, y se saltan
# limpiamente en vez de fallar sin explicar por qué (el mismo criterio que
# `revisor.yml` y `chromatic.yml`). Sin el secreto dado de alta, tampoco tienen
# llave en el propio repositorio: es a propósito, no hay ningún valor de relleno.
#
# Cada acción de terceros va fijada al SHA completo de su commit, con la etiqueta
# al lado. Una etiqueta se puede mover; un SHA, no.
name: CI

# `closed` está ahí solo para `infra-apply`: es el evento que llega cuando el pull
# request se fusiona. Los demás trabajos lo descartan en su `if`.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# Nada por defecto: cada trabajo declara lo suyo, y lo que no se declara no existe.
permissions: {}

# Si llega otro push a la misma rama, la ejecución anterior ya no responde a nada
# que importe y se cancela. `head_ref` agrupa por la rama del pull request; en un
# push a main, por `ref`.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # ¿La suite del backend pasa en una máquina limpia?
  #
  # Corre `make test`, exactamente el mismo comando que en local, contra una
  # PostgreSQL recién creada. NO afirma: que el frontend compile o pase sus
  # historias, que el documento OpenAPI esté al día (eso es `openapi.yml`), ni
  # nada que la suite no cubra (hoy, solo `auth` y lo que haya en tests/).
  # -------------------------------------------------------------------------
  test:
    name: "test: ¿la suite del backend pasa en una máquina limpia?"
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # La misma imagen que producción y que `db-test` de compose.yaml, publicada
    # en el 54411, que es el puerto que backend/.env.test ya espera. Usuario,
    # contraseña y base son los de .env.test: una base efímera que muere con el
    # trabajo, no un secreto. El runner no ejecuta ningún paso hasta que el
    # healthcheck pasa; se pregunta por TCP por la misma razón que en compose.yaml.
    services:
      db-test:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flowsync
          POSTGRES_PASSWORD: flowsync
          POSTGRES_DB: flowsync_test
        ports:
          - 54411:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flowsync -d flowsync_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s

    # `start/env.ts` valida estas variables al arrancar y .env.test no las trae
    # (en local salen de backend/.env, que no se versiona). Las DB_* y
    # SESSION_DRIVER no van aquí: las pone .env.test, y una variable del entorno
    # del proceso pisaría la del fichero. Ninguna es un secreto ni tiene que
    # serlo: `APP_KEY` existe solo para que la validación pase, como en
    # `openapi.yml`. DB_TEST_EXTERNA le dice al Makefile que la base ya está
    # levantada y que no intente un `docker compose up` sobre el mismo puerto.
    env:
      NODE_ENV: test
      TZ: UTC
      PORT: 3333
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      APP_KEY: clave-de-ci-sin-valor-secreto
      APP_URL: http://127.0.0.1:3333
      DB_TEST_EXTERNA: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      # La salida se guarda además en un fichero para que el paso siguiente
      # saque el recuento; `pipefail` hace que el código de salida sea el de
      # `make test`, no el de `tee`.
      - name: make test
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/make-test.log"

      # El recuento va al resumen de la ejecución, que es lo que se ve al abrirla,
      # y no a un echo enterrado en el registro. Corre también si los tests
      # fallan: es justo cuando más interesa.
      - name: Recuento de tests en el resumen
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/make-test.log"
          # Japa cierra con una línea «Tests  N passed, M failed (TOTAL)».
          linea=""
          if [ -f "$log" ]; then
            linea=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -E '^[[:space:]]*Tests[[:space:]]' | tail -n 1 || true)
          fi

          {
            echo "## Tests del backend"
            echo ""
            if [ -z "$linea" ]; then
              echo "La suite no llegó a imprimir su recuento: falló antes de correr"
              echo "(instalación, base de datos, migraciones o arranque). Mira el paso «make test»."
            else
              total=$(grep -oE '\([0-9]+\)' <<<"$linea" | tr -d '()' || true)
              echo "| Resultado | Tests |"
              echo "|---|---:|"
              for clave in passed failed skipped todo regression; do
                n=$(grep -oE "[0-9]+ $clave" <<<"$linea" | cut -d' ' -f1 || true)
                [ -z "$n" ] && continue
                case "$clave" in
                  passed) etiqueta="pasan" ;;
                  failed) etiqueta="fallan" ;;
                  skipped) etiqueta="saltados" ;;
                  todo) etiqueta="pendientes (todo)" ;;
                  regression) etiqueta="regresión" ;;
                esac
                echo "| $etiqueta | $n |"
              done
              echo "| **total** | **${total:-?}** |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # ¿El artefacto se puede fabricar desde cero?
  #
  # `make image`, el mismo atajo que en local, sobre un runner sin caché de
  # capas. Afirma que la imagen SE CONSTRUYE, y nada más: no la arranca, así que
  # no dice si la aplicación levanta dentro, ni qué variables le faltan, ni si
  # responde. Tampoco la publica en ningún registro ni mira su tamaño.
  # -------------------------------------------------------------------------
  image:
    name: "image: ¿el artefacto se puede fabricar desde cero?"
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make image
        run: make image

  # -------------------------------------------------------------------------
  # ¿Los propios archivos del pipeline son válidos?
  #
  # `make ci-lint`: actionlint (y shellcheck sobre cada `run:`) sobre todo
  # .github/workflows/, con la misma imagen fijada que en local. Afirma que la
  # sintaxis, las expresiones y los `run:` son válidos; no que los trabajos hagan
  # lo que dicen ni que los secretos que referencian existan.
  # -------------------------------------------------------------------------
  lint-workflows:
    name: "lint-workflows: ¿los propios archivos del pipeline son válidos?"
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make ci-lint
        run: make ci-lint

  # -------------------------------------------------------------------------
  # ¿Qué cambiaría en la infraestructura si este cambio se fusiona?
  #
  # Solo en pull requests del propio repositorio (un fork no recibe
  # RAILWAY_TOKEN) y solo si tocan `.railway/**`. GitHub no filtra rutas por
  # trabajo, así que el trabajo arranca, pregunta a la API qué ficheros toca el
  # pull request y, si ninguno está en `.railway/`, lo deja dicho en el resumen
  # y no llama a Railway. Si los toca, `railwayapp/config` calcula el plan, lo
  # fija como artefacto (`infra-apply` aplicará ESE plan, no uno nuevo) y lo
  # publica como comentario del pull request.
  #
  # `pull-requests: write` para ese comentario (y para leer la lista de
  # ficheros). Sin `id-token: write`: el comentario lo firma github-actions en
  # vez del bot de Railway, y no hace falta acuñar un token por OIDC.
  # -------------------------------------------------------------------------
  infra-plan:
    name: "infra-plan: ¿qué cambiaría en la infraestructura si este cambio se fusiona?"
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: ¿El pull request toca .railway/?
        id: railway
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Primero la lista entera y después el grep: con `gh … | grep -q` y
          # pipefail, el grep cerraría la tubería antes de tiempo y el SIGPIPE
          # de gh se leería como «no toca».
          ficheros=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -q '^\.railway/' <<<"$ficheros"; then
            echo "toca=true" >> "$GITHUB_OUTPUT"
          else
            echo "toca=false" >> "$GITHUB_OUTPUT"
            echo "Este pull request no toca \`.railway/\`: no hay plan de infraestructura que calcular." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.railway.outputs.toca == 'true'
        with:
          persist-credentials: false

      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        if: steps.railway.outputs.toca == 'true'
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  # -------------------------------------------------------------------------
  # El mismo plan, aplicado, cuando el pull request se fusiona.
  #
  # Mismas condiciones que `infra-plan` (propio repositorio, toca `.railway/`),
  # sobre el commit de la fusión. `railwayapp/config` con `command: apply` NO
  # vuelve a planificar: descarga el plan que `infra-plan` fijó para el último
  # commit del pull request y aplica exactamente ese; si el entorno o `.railway/`
  # cambiaron desde entonces, falla en vez de aplicar algo que nadie revisó.
  #
  # `actions: read` para descargar ese artefacto; `pull-requests: read` para la
  # lista de ficheros. Su propio grupo de concurrencia sin cancelación: dos
  # fusiones seguidas aplican una detrás de otra, y un apply nunca se corta a
  # medias.
  # -------------------------------------------------------------------------
  infra-apply:
    name: "infra-apply: el mismo plan, aplicado al fusionar"
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    steps:
      - name: ¿El pull request toca .railway/?
        id: railway
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Lista entera primero, grep después: ver el mismo paso de infra-plan.
          ficheros=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -q '^\.railway/' <<<"$ficheros"; then
            echo "toca=true" >> "$GITHUB_OUTPUT"
          else
            echo "toca=false" >> "$GITHUB_OUTPUT"
            echo "Este pull request no tocaba \`.railway/\`: no hay plan que aplicar." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.railway.outputs.toca == 'true'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        if: steps.railway.outputs.toca == 'true'
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
